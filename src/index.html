<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StaffAway</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- Shown while the session is restored; Angular replaces it once the app has started. -->
    <app-root>
      <div
        role="status"
        aria-label="Loading StaffAway"
        style="display: grid; place-items: center; min-height: 100vh; background: #f4f5f8"
      >
        <img src="logo-mark.png" alt="" width="40" height="40" />
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
