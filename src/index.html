<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StaffAway</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS: home-screen icon and title for "Add to Home Screen" (Safari does not use the manifest icons). -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-title" content="StaffAway" />
    <meta name="theme-color" content="#3654d1" />
    <!-- Link previews (LinkedIn, Slack, messengers): crawlers don't run JS, so these must be static. -->
    <meta name="description" content="Leave management for teams. Request, approve and track time off." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://staffaway.space/" />
    <meta property="og:title" content="StaffAway — leave management for teams" />
    <meta property="og:description" content="Request, approve and track time off. Multi-tenant, 2FA, team calendar." />
    <meta property="og:image" content="https://staffaway.space/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Shown while the session is restored; Angular replaces it once the app has started. -->
    <app-root>
      <div
        role="status"
        aria-label="Loading StaffAway"
        style="display: grid; place-items: center; min-height: 100vh; background: #f4f5f8"
      >
        <img src="logo-mark.png" alt="" width="40" height="40" />
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
