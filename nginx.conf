server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    # The backend scopes the refresh cookie to /auth; from the browser's side that is /api/auth.
    proxy_cookie_path /auth /api/auth;
    # Attachments are limited to 5 MB by the backend; leave room for the multipart envelope.
    client_max_body_size 6m;
  }

  # nginx's mime.types has no entry for .webmanifest.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / {
    # index.html and ngsw.json must never be served stale; hashed bundles revalidate cheaply.
    add_header Cache-Control "no-cache";
    # Anything that is not a real file is an app route.
    try_files $uri /index.html;
  }
}
